<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Rohi’s Stylish Hover Button</title>

		<!-- internal css -->
		<style>
			body {
				font-family: sans-serif;
			}

			.btn {
				display: block;
				margin: 20px auto;
				padding: 20px 40px;
				background-color: #8e44ad;
				color: #fff;
				font-size: 20px;
				border-radius: 15px;
				border: none;
			}

			.btn:hover {
				background-color: #2c3e50;
			}
		</style>
	</head>

	<body>
		<h1 style="text-align: center; margin: 20px;">Rohi’s Stylish Hover Button</h1>

		<!-- button -->
		<button class="btn">Click Me!</button>

	</body>

</html>
