<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>session_06_html_tables</title>

		<style>
			body {
				font-family: sans-serif;
			}

			table, th, td {
				border: 1px solid #000;
			}

			table {
				width: 30%;
				border-spacing: 5px;
				/* border-collapse: collapse; */
			}

			th {
				background-color: lightblue;
				padding: 15px;
			}

			td {
				background-color: lightpink;
				padding: 5px;
			}
		</style>
	</head>

	<body>
		<h1 style="text-align: center;">session_06_html_tables</h1>

		<!-- table -->
		<div style="margin: 20px;">
			<table>
				<!-- table row -->
				<tr>
					<!-- table header -->
					<th>First Name</th>
					<th>Last Name</th>
					<th>Age</th>
				</tr>
				<tr>
					<!-- table data -->
					<td>Jill</td>
					<td>Smith</td>
					<td>40</td>
				</tr>
				<tr>
					<td>Eve</td>
					<td>Jackson</td>
					<td>70</td>
				</tr>
				<tr>
					<td>John</td>
					<td>Doe</td>
					<td>50</td>
				</tr>
			</table>
		</div>

		<!-- rowspan -->
		<div style="margin: 20px;">
			<table>
				<tr>
					<th>Name</th>
					<td>John Smith</td>
				</tr>
				<tr>
					<th rowspan="2">Telephone:</th>
					<td>12345678</td>
				</tr>
				<tr>
					<td>87654321</td>
				</tr>
			</table>
		</div>

		<!-- colspan -->
		<div style="margin: 20px;">
			<table>
				<tr>
					<th>Name</th>
					<th colspan="2">Telephone</th>
				</tr>
				<tr>
					<td>Eve Jackson</td>
					<td>12345678</td>
					<td>87654321</td>
				</tr>
			</table>
		</div>

	</body>

</html>
