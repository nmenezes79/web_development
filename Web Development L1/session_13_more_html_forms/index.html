<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="stryle.css">
		<title>session_13_more_html_forms</title>
	</head>

	<body>
		<!-- main container -->
		<div class="container">
			<!-- navigation -->
			<div class="header">
				<ul>
					<li>Round Trip</li>
					<li>One Way</li>
					<li>Multi City</li>
				</ul>
			</div>

			<!-- form -->
			<form action="#" method="post">
				<!-- departure -->
				<div class="form-group">
					<label for="depature">From</label>
					<input type="text" id="depature" name="depature" placeholder="Type Depature City">
				</div>

				<!-- destination -->
				<div class="form-group">
					<label for="destination">To</label>
					<input type="text" id="destination" name="destination" placeholder="Type Destination City">
				</div>

				<!-- search button -->
				<button type="submit" class="search-button">🔍 Search Flight</button>
			</form>
		</div>

	</body>

</html>
